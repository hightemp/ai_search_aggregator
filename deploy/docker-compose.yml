services:
  proxy:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9081:80"
    restart: always
    depends_on:
      - frontend
      - backend
    networks:
      - internal

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    env_file:
      - .env
    ports:
      - "9080:8080"
    volumes:
      - ./tmp:/tmp
    restart: always
    depends_on:
      - searx
    networks:
      - internal

  searx:
    image: searxng/searxng:latest
    env_file:
      - .env
    volumes:
      - ./searxng_settings.yml:/etc/searxng/settings.yml:ro
      - ./limiter.toml:/etc/searxng/limiter.toml:ro
    ports:
      - "8081:8080"
    environment:
      - BASE_URL=http://localhost:8081
    restart: always
    depends_on:
      - searx_proxy
    networks:
      - internal
  
  searx_proxy:
    # https://github.com/hightemp/go_proxy_mux
    image: hightemp/go_proxy_mux:1.0.2
    ports:
      - "8380:8380"
    volumes:
      - ./config.yaml:/root/config.yaml
    restart: always
    networks:
      - internal

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    ports:
      - "8082:80"
    env_file:
      - .env
    restart: always
    depends_on:
      - backend
    networks:
      - internal

networks:
  internal:
    driver: bridge
